extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.3"
    import: ["@key", "@shareable", "@external", "@requires", "@provides"]
  )

type Variant @key(fields: "sku") {
  sku: String!
  inStock: Boolean!
  stockLevel: Int!
  warehouses: [Warehouse!]!
}

type Warehouse @key(fields: "id", resolvable: false) {
  id: ID!
}
