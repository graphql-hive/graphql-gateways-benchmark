extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.3"
    import: ["@key", "@shareable", "@external", "@requires", "@provides"]
  )

type Query {
  category(id: ID!): Category
  categories: [Category!]!
}

type Category @key(fields: "id") {
  id: ID!
  name: String!
  slug: String!
  level: Int
  parent: Category
  children: [Category!]!
}
