name: notify-website

# https://the-guild.dev/graphql/hive/federation-gateway-performance is built by
# the-guild-org/website, which fetches website/stress-data.csv and
# website/constant-data.csv from main at build time. Tell it to redeploy
# whenever the results change.
on:
  push:
    branches:
      - main
    paths:
      - website/*.csv

# The dispatch uses a PAT, so the workflow token needs no permissions at all.
permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: trigger website rebuild
        env:
          # Fine-grained PAT for the-guild-org/website with contents:write
          # (repository_dispatch permission).
          TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/the-guild-org/website/dispatches \
            -d '{"event_type":"federation-gateways-content-update"}'
