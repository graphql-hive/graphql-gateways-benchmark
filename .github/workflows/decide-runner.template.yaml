on:
  workflow_call:
    outputs:
      runner:
        value: ${{ jobs.setup.outputs.runner }}
      gateways:
        description: JSON array with the name of every directory under gateways/
        value: ${{ jobs.setup.outputs.gateways }}

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.step1.outputs.runner }}
      gateways: ${{ steps.gateways.outputs.gateways }}
    name: setup
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # The benchmark matrix is derived from the repository layout, so adding a
      # gateway directory is enough to get it benchmarked in every scenario.
      - name: list gateways
        id: gateways
        run: |
          gateways="$(ls -d gateways/*/ | xargs -n1 basename | jq -R . | jq -sc .)"
          echo "gateways=$gateways" >> "$GITHUB_OUTPUT"
          echo "Gateways: $gateways"

      - name: decide on runner
        id: step1
        run: |
          if [ ${{ github.event_name }} == 'pull_request' ]; then
            echo "using GitHub Actions default runner"
            echo "runner=ubuntu-22.04" >> $GITHUB_OUTPUT
          else
            echo "using stable runner: 'benchmark-runner-1'"
            echo 'runner=benchmark-runner-1' >> $GITHUB_OUTPUT
          fi
