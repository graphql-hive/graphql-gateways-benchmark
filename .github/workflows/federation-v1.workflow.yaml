          - hive-router
          - cosmo
          - grafbase
    uses: ./.github/workflows/benchmark.template.yaml
    with:
      gateway: ${{ matrix.directory }}
      # Planning runs a single VU for a fixed number of iterations;
      # vu and time are not used in this mode.
      vu: 1
      time: 0s
      scenarioName: query-planning
      runner: ${{ needs.decide-runner.outputs.runner }}
      cpuLimit: 3
      fork: 2
      memoryLimit: 6gb
      mode: planning
      waitForUrl: ${{ startsWith(matrix.directory, 'hive-gateway') && 'http://localhost:4000/healthcheck' || '' }}

  query-planning-report:
    # The report template comments on the PR and commits results.
    permissions: write-all
    needs: query-planning
    uses: ./.github/workflows/planning-report.template.yaml
    secrets: inherit
    with:
      scenarioName: query-planning

  query-planning-large:
