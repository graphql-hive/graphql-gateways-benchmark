name: federation-v1
on:
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  # we group by event name because we dont want to cancel workflow dispatch runs on pr commits
  group: federation-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  decide-runner:
    uses: ./.github/workflows/decide-runner.template.yaml

  constant-vus-over-time:
    needs:
      - decide-runner
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.decide-runner.outputs.gateways) }}
    uses: ./.github/workflows/benchmark.template.yaml
    with:
      gateway: ${{ matrix.directory }}
      vu: 50
      time: ${{ github.event_name == 'pull_request' && '30s' || '60s' }}
      scenarioName: constant-vus-over-time
      runner: ${{ needs.decide-runner.outputs.runner }}
      cpuLimit: 3
      fork: 2
      memoryLimit: 6gb
      mode: constant
      waitForUrl: ${{ startsWith(matrix.directory, 'hive-gateway') && 'http://localhost:4000/healthcheck' || '' }}
      runs: ${{ github.event_name == 'pull_request' && 3 || 5 }}
      cooldownMaxSeconds: ${{ github.event_name == 'pull_request' && 0 || 90 }}

  constant-vus-over-time-report:
    needs: constant-vus-over-time
    uses: ./.github/workflows/report.template.yaml
    secrets: inherit
    with:
      scenarioName: constant-vus-over-time

  # Every subgraph call is delayed by a few milliseconds, like a subgraph that
  # talks to a database would be. This keeps the gateway's own overhead from
  # dominating the measurement the way the zero-latency scenario does.
  constant-vus-subgraphs-delay:
    needs:
      - decide-runner
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.decide-runner.outputs.gateways) }}
    uses: ./.github/workflows/benchmark.template.yaml
    with:
      gateway: ${{ matrix.directory }}
      vu: 50
      time: ${{ github.event_name == 'pull_request' && '30s' || '60s' }}
      scenarioName: constant-vus-subgraphs-delay
      runner: ${{ needs.decide-runner.outputs.runner }}
      cpuLimit: 3
      fork: 2
      memoryLimit: 6gb
      subgraphDelay: 4
      mode: constant
      waitForUrl: ${{ startsWith(matrix.directory, 'hive-gateway') && 'http://localhost:4000/healthcheck' || '' }}
      runs: ${{ github.event_name == 'pull_request' && 3 || 5 }}
      cooldownMaxSeconds: ${{ github.event_name == 'pull_request' && 0 || 90 }}

  constant-vus-subgraphs-delay-report:
    needs: constant-vus-subgraphs-delay
    uses: ./.github/workflows/report.template.yaml
    secrets: inherit
    with:
      scenarioName: constant-vus-subgraphs-delay

  ramping-vus:
    needs:
      - decide-runner
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.decide-runner.outputs.gateways) }}
    uses: ./.github/workflows/benchmark.template.yaml
    with:
      gateway: ${{ matrix.directory }}
      vu: 500
      time: 60s
      scenarioName: ramping-vus
      runner: ${{ needs.decide-runner.outputs.runner }}
      cpuLimit: 4
      fork: 3
      memoryLimit: 8gb
      mode: stress
      waitForUrl: ${{ startsWith(matrix.directory, 'hive-gateway') && 'http://localhost:4000/healthcheck' || '' }}
      runs: ${{ github.event_name == 'pull_request' && 3 || 5 }}
      cooldownMaxSeconds: ${{ github.event_name == 'pull_request' && 0 || 90 }}

  ramping-vus-report:
    needs: ramping-vus
    uses: ./.github/workflows/report.template.yaml
    secrets: inherit
    with:
      scenarioName: ramping-vus
