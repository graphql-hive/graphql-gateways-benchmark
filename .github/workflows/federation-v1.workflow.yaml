  ramping-vus:
    needs:
      - decide-runner
    strategy:
      fail-fast: false
      matrix:
        directory:
          - apollo-gateway
          - apollo-router
          - apollo-router-v3
          - apollo-router-v3-incremental
          - hive-gateway
          - hive-gateway-router-runtime
          - hive-router
          - cosmo
          - grafbase
    uses: ./.github/workflows/benchmark.template.yaml
    with:
      gateway: ${{ matrix.directory }}
      vu: 500
      time: 60s
      scenarioName: ramping-vus
      runner: ${{ needs.decide-runner.outputs.runner }}
      cpuLimit: 4
      fork: 3
      memoryLimit: 8gb
      mode: stress
      waitForUrl: ${{ startsWith(matrix.directory, 'hive-gateway') && 'http://localhost:4000/healthcheck' || '' }}

  ramping-vus-report:
    # The report template comments on the PR and commits results.
    permissions: write-all
    needs: ramping-vus
    uses: ./.github/workflows/report.template.yaml
